# Blueprint de Render para el backend de TECSUR.
# Crea el servicio web + la base PostgreSQL automáticamente.
services:
  - type: web
    name: tecsur-backend
    runtime: python
    # De pago: Starter (0.5 CPU, 512 MB). Verificado en el panel el 2026-10-11.
    plan: starter
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      # Sin esto el default era "*": cualquier Host pasaba la validación.
      - key: ALLOWED_HOSTS
        value: "tecsur-backend.onrender.com"
      - key: PYTHON_VERSION
        value: "3.13.4"
      - key: DATABASE_URL
        fromDatabase:
          name: tecsur-db
          property: connectionString

databases:
  - name: tecsur-db
    # De pago: Basic-256mb (0.1 CPU, 256 MB RAM, 1 GB de disco); no vence.
    plan: basic-256mb
    databaseName: tecsur
    user: tecsur
