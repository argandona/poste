# Blueprint de Render para el backend de TECSUR.
# Crea el servicio web + la base PostgreSQL automáticamente.
services:
  - type: web
    name: tecsur-backend
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      # Sin esto el default era "*": cualquier Host pasaba la validación.
      - key: ALLOWED_HOSTS
        value: "tecsur-backend.onrender.com"
      - key: PYTHON_VERSION
        value: "3.13.4"
      - key: DATABASE_URL
        fromDatabase:
          name: tecsur-db
          property: connectionString

databases:
  - name: tecsur-db
    plan: free
    databaseName: tecsur
    user: tecsur
